[project]
name = "fezfm"
version = "0.1.0"
description = "FEZfm collector: earthquake reports from IRSC, USGS and EMSC, stored in DuckDB and exported for the FEZfm monitor site."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
]

[project.scripts]
fezfm = "fezfm.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fezfm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
